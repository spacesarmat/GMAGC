name: Build Android

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths: ["apps/**", ".github/workflows/build-android.yml"]

env:
  # держать в синхронизации с apps/*/pyproject.toml и requirements-dev.txt
  FLET_VERSION: "1.0.0"
  # Flet выводит символы вне cp1252; на Windows без UTF-8 сборка падает
  PYTHONUTF8: "1"
  FLET_CLI_NO_RICH_OUTPUT: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Версия из тега
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="0.0.0"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - run: python -m pip install "flet==$FLET_VERSION"
      - name: Ключ подписи Android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/gmagc-upload.p12"
            echo "SIGN_ARGS=--android-signing-key-store $RUNNER_TEMP/gmagc-upload.p12 --android-signing-key-alias gmagc" >> "$GITHUB_ENV"
            echo "Подпись: постоянный ключ GMAGC"
          else
            echo "::warning::Секрета ключа нет (запуск из форка): APK подписывается временным отладочным ключом"
          fi
      - name: Сборка APK
        env:
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: flet build apk apps/mobile --yes --no-rich-output -v $SIGN_ARGS --build-version "$VERSION" --build-number "$GITHUB_RUN_NUMBER"
      - name: Проверка подписи APK
        env:
          # отпечаток SHA-256 сертификата постоянного ключа GMAGC (публичная информация)
          EXPECTED_SHA256: "BE:7C:D5:91:1E:FC:B5:1E:1A:08:6F:5C:14:3A:A3:3D:18:B1:12:2A:34:D9:F9:F5:99:F6:8C:4F:5D:99:84:20"
        run: |
          APK=$(find apps/mobile/build/apk -name "*.apk" | head -1)
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(find "$SDK/build-tools" -name apksigner 2>/dev/null | sort | tail -1)
          if [ -z "$APKSIGNER" ]; then echo "::warning::apksigner не найден, подпись не проверена"; exit 0; fi
          "$APKSIGNER" verify --print-certs "$APK" | tee signer.txt
          if [ -n "$SIGN_ARGS" ]; then
            ACTUAL=$(grep -i "SHA-256 digest" signer.txt | head -1 | sed 's/.*: //' | tr 'a-f' 'A-F')
            EXPECTED=$(echo "$EXPECTED_SHA256" | tr -d ':')
            if [ "$ACTUAL" != "$EXPECTED" ]; then echo "::error::APK подписан не постоянным ключом: $ACTUAL"; exit 1; fi
            echo "APK подписан постоянным ключом GMAGC"
          fi
      - name: Упаковка
        run: |
          mkdir -p dist
          NAME="GMAGC-android-${VERSION}.apk"
          APK=$(find apps/mobile/build/apk -name "*.apk" | head -1)
          cp "$APK" "dist/$NAME"
          (cd dist && sha256sum "$NAME" > "$NAME.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: GMAGC-android
          path: dist/*
      - name: Публикация в релиз
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "GMAGC $GITHUB_REF_NAME" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
