name: Build Android

on:
  push:
    tags: ["v*"]
    branches: [feat/pyside6]
    paths:
      - .github/workflows/build-android.yml
      - apps/mobile/**
      - packaging/android_qt/**
  workflow_dispatch:

env:
  PYSIDE_VERSION: "6.11.2"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64]  # x86_64 — только для проверки запуска в эмуляторе, в релиз не попадает
    env:
      ARCH: ${{ matrix.arch }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Инструменты Qt for Python
        run: |
          python -m pip install "pyside6==$PYSIDE_VERSION" "shiboken6==$PYSIDE_VERSION" pip setuptools wheel
      - name: Системные пакеты для сборки (libffi и др.)
        run: sudo apt-get update && sudo apt-get install -y libtool libtool-bin autoconf automake pkg-config build-essential libltdl-dev libffi-dev zlib1g-dev unzip zip
      - name: Зависимости pyside6-android-deploy
        run: |
          REQ="$(python -c 'import os, PySide6; print(os.path.join(os.path.dirname(PySide6.__file__), "scripts", "requirements-android.txt"))')"
          python -m pip install -r "$REQ"
      - name: Android SDK и NDK
        run: |
          git clone --depth 1 --branch "v$PYSIDE_VERSION" https://code.qt.io/pyside/pyside-setup "$RUNNER_TEMP/pyside-setup"
          cd "$RUNNER_TEMP/pyside-setup"
          python -m pip install -r tools/cross_compile_android/requirements.txt || true
          python tools/cross_compile_android/main.py --download-only --skip-update --auto-accept-license
      - name: Колёса Qt for Python для Android
        run: |
          BASE=https://download.qt.io/official_releases/QtForPython
          mkdir -p "$RUNNER_TEMP/wheels"
          curl -fsSL -o "$RUNNER_TEMP/wheels/pyside6-$PYSIDE_VERSION-$PYSIDE_VERSION-cp311-cp311-android_${ARCH}.whl" "$BASE/pyside6/pyside6-$PYSIDE_VERSION-$PYSIDE_VERSION-cp311-cp311-android_${ARCH}.whl"
          curl -fsSL -o "$RUNNER_TEMP/wheels/shiboken6-$PYSIDE_VERSION-$PYSIDE_VERSION-cp311-cp311-android_${ARCH}.whl" "$BASE/shiboken6/shiboken6-$PYSIDE_VERSION-$PYSIDE_VERSION-cp311-cp311-android_${ARCH}.whl"
          ls -la "$RUNNER_TEMP/wheels"
      - name: Версия и параметры пакета
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="$(grep -oP '(?<=^VERSION = ")[^"]+' apps/mobile/src/gmagc_phone/about.py)"; fi
          echo "GMAGC_VERSION=$VERSION" >> "$GITHUB_ENV"
          # versionCode должен быть больше, чем у прежних сборок (там был номер запуска, единицы и десятки)
          echo "GMAGC_VERSION_CODE=$((200000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "GMAGC_ICON=$GITHUB_WORKSPACE/apps/mobile/src/assets/icon.png" >> "$GITHUB_ENV"
      - name: Идентификатор пакета, версия, разрешения
        run: python packaging/android_qt/patch_buildozer.py
      - name: Сборка APK
        working-directory: apps/mobile/src
        run: |
          pyside6-android-deploy --name GMAGC             --wheel-pyside "$RUNNER_TEMP/wheels/pyside6-$PYSIDE_VERSION-$PYSIDE_VERSION-cp311-cp311-android_${ARCH}.whl"             --wheel-shiboken "$RUNNER_TEMP/wheels/shiboken6-$PYSIDE_VERSION-$PYSIDE_VERSION-cp311-cp311-android_${ARCH}.whl"             --force -v
      - name: Подпись постоянным ключом
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          # отпечаток SHA-256 сертификата постоянного ключа GMAGC (публичная информация)
          EXPECTED_SHA256: "BE:7C:D5:91:1E:FC:B5:1E:1A:08:6F:5C:14:3A:A3:3D:18:B1:12:2A:34:D9:F9:F5:99:F6:8C:4F:5D:99:84:20"
        run: |
          APK=$(find apps/mobile/src -maxdepth 1 -name "*.apk" | head -1)
          SDK="$HOME/.pyside6_android_deploy/android-sdk"
          APKSIGNER=$(find "$SDK/build-tools" -name apksigner 2>/dev/null | sort | tail -1)
          mkdir -p dist
          NAME="GMAGC-android-${GMAGC_VERSION}.apk"
          if [ -n "$KEYSTORE_B64" ] && [ -n "$APKSIGNER" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/gmagc-upload.p12"
            "$APKSIGNER" sign --ks "$RUNNER_TEMP/gmagc-upload.p12" --ks-type PKCS12 --ks-key-alias gmagc               --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD --out "dist/$NAME" "$APK"
            "$APKSIGNER" verify --print-certs "dist/$NAME" | tee signer.txt
            ACTUAL=$(grep -i "SHA-256 digest" signer.txt | head -1 | sed 's/.*: //' | tr 'a-f' 'A-F')
            EXPECTED=$(echo "$EXPECTED_SHA256" | tr -d ':')
            if [ "$ACTUAL" != "$EXPECTED" ]; then echo "::error::APK подписан не постоянным ключом: $ACTUAL"; exit 1; fi
            echo "APK подписан постоянным ключом GMAGC"
          else
            echo "::warning::Ключа подписи нет (запуск из форка): APK остаётся с отладочной подписью"
            cp "$APK" "dist/$NAME"
          fi
          rm -f dist/*.idsig
          (cd dist && sha256sum "$NAME" > "$NAME.sha256")
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GMAGC-android-${{ matrix.arch }}
          path: |
            dist/*
            apps/mobile/src/pysidedeploy.spec
            apps/mobile/src/buildozer.spec
          if-no-files-found: warn
      - name: Публикация в релиз
        if: startsWith(github.ref, 'refs/tags/v') && matrix.arch == 'aarch64'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "GMAGC $GITHUB_REF_NAME" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  # Дымовая проверка: APK ставится в эмулятор, запускается и не падает. Не блокирует релиз (эмулятор x86_64 гоняет
  # arm64-приложение через трансляцию), но показывает, что приложение стартует, и оставляет снимок экрана и лог.
  smoke:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: GMAGC-android-x86_64
          path: apk
      - name: Включить KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back virtualscene
          script: bash packaging/android_qt/smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GMAGC-android-smoke
          path: smoke/*
          if-no-files-found: warn
