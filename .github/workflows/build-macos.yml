name: Build macOS

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths: ["apps/**", ".github/workflows/build-macos.yml"]

env:
  # держать в синхронизации с apps/*/pyproject.toml и requirements-dev.txt
  FLET_VERSION: "1.0.0"
  # Flet выводит символы вне cp1252; на Windows без UTF-8 сборка падает
  PYTHONUTF8: "1"
  FLET_CLI_NO_RICH_OUTPUT: "1"

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Версия из тега
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="0.0.0"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - run: python -m pip install "flet==$FLET_VERSION"
      - name: Сборка (универсальный пакет)
        run: flet build macos apps/desktop --yes --no-rich-output -v --build-version "$VERSION" --build-number "$GITHUB_RUN_NUMBER"
      - name: Дымовая проверка запуска
        run: |
          APP=$(find apps/desktop/build/macos -maxdepth 1 -name "*.app" | head -1)
          BIN=$(find "$APP/Contents/MacOS" -type f -perm -u+x | head -1)
          touch "$RUNNER_TEMP/marker"
          "$BIN" > "$RUNNER_TEMP/app_out.txt" 2> "$RUNNER_TEMP/app_err.txt" &
          PID=$!
          sleep 25
          ALIVE=1
          kill -0 "$PID" 2>/dev/null || ALIVE=0
          kill "$PID" 2>/dev/null || true
          LOGS=$(find "$HOME/Library" -name console.log -newer "$RUNNER_TEMP/marker" 2>/dev/null)
          echo "--- stderr ---"; cat "$RUNNER_TEMP/app_err.txt"
          echo "--- stdout ---"; cat "$RUNNER_TEMP/app_out.txt"
          echo "--- console.log ---"; for f in $LOGS; do echo "$f"; cat "$f"; done
          if [ "$ALIVE" = "0" ]; then echo "Приложение завершилось само"; exit 1; fi
          if grep -q Traceback "$RUNNER_TEMP/app_err.txt" "$RUNNER_TEMP/app_out.txt" $LOGS 2>/dev/null; then echo "В выводе приложения есть ошибка Python"; exit 1; fi
      - name: Упаковка
        run: |
          mkdir -p dist
          NAME="GMAGC-desktop-macos-${VERSION}.zip"
          APP=$(find apps/desktop/build/macos -maxdepth 1 -name "*.app" | head -1)
          ditto -c -k --keepParent "$APP" "dist/$NAME"
          (cd dist && shasum -a 256 "$NAME" > "$NAME.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: GMAGC-desktop-macos
          path: dist/*
      - name: Публикация в релиз
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "GMAGC $GITHUB_REF_NAME" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
