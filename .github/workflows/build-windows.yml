name: Build Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  PYTHONUTF8: "1"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Версия из тега
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="0.0.0"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - run: python -m pip install -r packaging/pyinstaller/requirements.txt
      - name: Сборка (PyInstaller)
        run: pyinstaller packaging/pyinstaller/gmagc-desktop.spec --noconfirm --distpath dist-app --workpath build-app
      - name: Дымовая проверка запуска
        shell: pwsh
        run: |
          $exe = Get-Item dist-app/gmagc-desktop/gmagc-desktop.exe
          $err = Join-Path $env:RUNNER_TEMP "app_err.txt"
          $out = Join-Path $env:RUNNER_TEMP "app_out.txt"
          $p = Start-Process -FilePath $exe.FullName -PassThru -RedirectStandardError $err -RedirectStandardOutput $out
          Start-Sleep -Seconds 25
          $exited = $p.HasExited
          if (-not $exited) { Stop-Process -Id $p.Id -Force }
          Write-Host "--- stderr ---"
          Get-Content $err -ErrorAction SilentlyContinue
          Write-Host "--- stdout ---"
          Get-Content $out -ErrorAction SilentlyContinue
          if ($exited) { throw "Приложение завершилось само, код $($p.ExitCode)" }
          if ((Select-String -Path $err, $out -Pattern "Traceback" -Quiet)) { throw "В выводе приложения есть ошибка Python" }
      - name: Упаковка
        run: |
          mkdir -p dist
          NAME="GMAGC-desktop-windows-${VERSION}.zip"
          (cd dist-app/gmagc-desktop && 7z a -tzip "$GITHUB_WORKSPACE/dist/$NAME" .)
          (cd dist && sha256sum "$NAME" > "$NAME.sha256")
      - name: Установщик (Inno Setup)
        run: |
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ ! -f "$ISCC" ]; then echo "::error::ISCC.exe не найден по ожидаемому пути ($ISCC)"; exit 1; fi
          # MSYS_NO_PATHCONV: иначе Git Bash принимает /DAppVersion=... за unix-путь и портит аргумент
          MSYS_NO_PATHCONV=1 "$ISCC" "/DAppVersion=$VERSION" "/DSourceDir=$(cygpath -w "$GITHUB_WORKSPACE/dist-app/gmagc-desktop")" packaging/windows/gmagc.iss
          SETUP_NAME="GMAGC-Setup-${VERSION}.exe"
          mv packaging/windows/dist/*.exe "dist/$SETUP_NAME"
          (cd dist && sha256sum "$SETUP_NAME" > "$SETUP_NAME.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: GMAGC-desktop-windows
          path: dist/*
      - name: Публикация в релиз
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "GMAGC $GITHUB_REF_NAME" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
