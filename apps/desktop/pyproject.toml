[project]
name = "gmagc-desktop"
version = "1.0.0"
description = "GMAGC: поиск гобо по фото (ПК-приложение)"
requires-python = ">=3.12,<3.13"
authors = [{ name = "@ANDY_BUM" }]
dependencies = [
  "flet==1.0.0",
  "numpy",
  "opencv-python-headless",
  "Pillow",
  "segno",
]

[tool.flet]
product = "GMAGC"
company = "@ANDY_BUM"
copyright = "Copyright (C) 2026 @ANDY_BUM"
org = "com.spacesarmat"
icon_background = "#040c1f"  # фон иконки (тёмно-синий рисунка): подложка Android и плитка macOS

[tool.flet.app]
path = "src"  # main.py лежит в src/

[tool.flet.compile]
packages = false  # OpenCV читает свой config.py как файл, поэтому исходники пакетов нужны
