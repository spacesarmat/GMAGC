[project]
name = "gmagc-desktop"
version = "2.0.0"
description = "GMAGC: поиск гобо по фото (ПК-приложение)"
requires-python = ">=3.12,<3.13"
authors = [{ name = "@ANDY_BUM" }]
dependencies = [
  "PySide6-Essentials",
  "numpy",
  "opencv-python-headless",
  "Pillow",
  "segno",
  "rapidocr-onnxruntime",  # автозаполнение профиля: распознавание текста инструкции на ПК
  "pypdfium2",  # страницы PDF в картинки
  "anthropic",  # облачное распознавание инструкции (по кнопке, ключ пользователя)
]

# Сборка ПК-приложения — PyInstaller: packaging/pyinstaller/gmagc-desktop.spec (см. README)
