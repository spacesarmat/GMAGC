<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">GMAGC — лупа с гобо</title>
  <desc id="desc">Векторный логотип: поисковая лупа с геометрическим рисунком гобо на прозрачном фоне.</desc>
  <defs>
    <linearGradient id="rim" x1="190" y1="170" x2="735" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.42" stop-color="#f7fbff"/>
      <stop offset="0.72" stop-color="#63dfff"/>
      <stop offset="0.9" stop-color="#2d9cff"/>
      <stop offset="1" stop-color="#d973ff"/>
    </linearGradient>
    <linearGradient id="handle" x1="650" y1="646" x2="892" y2="896" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.56" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#75ccff"/>
    </linearGradient>
    <radialGradient id="glass" cx="48%" cy="45%" r="63%">
      <stop offset="0" stop-color="#14518f"/>
      <stop offset="0.42" stop-color="#0a2d60"/>
      <stop offset="1" stop-color="#03142f"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#cfffff" stop-opacity="0.9"/>
      <stop offset="0.22" stop-color="#3edbff" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#198dff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-35%" y="-35%" width="170%" height="170%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="smallGlow" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="lensClip"><circle cx="430" cy="430" r="282"/></clipPath>
  </defs>

  <!-- Only the magnifying glass and gobo remain; the canvas is transparent. -->
  <g filter="url(#softGlow)">
    <circle cx="430" cy="430" r="318" fill="none" stroke="#159dff" stroke-opacity="0.32" stroke-width="22"/>
    <circle cx="430" cy="430" r="303" fill="url(#glass)" stroke="url(#rim)" stroke-width="36"/>
  </g>

  <g clip-path="url(#lensClip)">
    <circle cx="430" cy="430" r="276" fill="url(#glass)"/>

    <!-- Eight aperture-like gobo fragments. -->
    <g fill="#ffffff" filter="url(#smallGlow)">
      <path d="M432 201 L502 316 L451 357 Z"/>
      <path d="M548 245 L591 356 L512 382 Z"/>
      <path d="M618 339 L626 458 L529 427 Z"/>
      <path d="M626 489 L543 576 L500 477 Z"/>
      <path d="M529 618 L412 629 L449 521 Z"/>
      <path d="M370 620 L282 541 L386 492 Z"/>
      <path d="M246 487 L236 369 L340 408 Z"/>
      <path d="M266 333 L354 248 L390 352 Z"/>
    </g>

    <!-- Dark separators and central luminous aperture. -->
    <circle cx="430" cy="430" r="105" fill="#0a3268" fill-opacity="0.48"/>
    <circle cx="430" cy="430" r="92" fill="url(#core)"/>
  </g>

  <!-- Neck and handle. -->
  <path d="M643 643 L707 707" fill="none" stroke="#0a2b5c" stroke-width="70" stroke-linecap="round"/>
  <path d="M647 647 L710 710" fill="none" stroke="url(#rim)" stroke-width="48" stroke-linecap="round" filter="url(#smallGlow)"/>
  <path d="M690 690 L884 884" fill="none" stroke="#168bff" stroke-opacity="0.38" stroke-width="108" stroke-linecap="round" filter="url(#softGlow)"/>
  <path d="M690 690 L884 884" fill="none" stroke="url(#handle)" stroke-width="84" stroke-linecap="round"/>
</svg>
