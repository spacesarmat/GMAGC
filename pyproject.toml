[tool.pytest.ini_options]
pythonpath = ["apps/desktop/src", "apps/mobile/src", "."]
testpaths = ["tests"]
# весь набор обычно укладывается в ~70с; таймаут на отдельный тест — чтобы зависший тест падал с трассировкой
# за секунды, а не молча вешал CI на 15-20 минут (случалось на macOS-раннере, причина не установлена)
timeout = 30

[tool.ruff]
line-length = 125
target-version = "py312"
src = ["apps/desktop/src", "apps/mobile/src", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"**/lang_en.py" = ["E501"]  # ключи словарей — длинные русские тексты целиком, их нельзя разбивать
"scripts/*.py" = ["E402", "I001"]  # sys.path подменяется до импортов намеренно
"tests/test_scripts.py" = ["E402", "I001"]
"tests/test_thumbs.py" = ["E402", "I001"]
