[tool.pytest.ini_options]
pythonpath = ["apps/desktop", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 125
target-version = "py312"
src = ["apps/desktop", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402", "I001"]  # sys.path подменяется до импортов намеренно
"tests/test_scripts.py" = ["E402", "I001"]
